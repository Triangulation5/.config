[package]
name = "silhouette-wallpaper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wallpaper-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha1 = "0.10"
fs2 = "0.4"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "gif", "webp"] }
regex = "1"
url = "2"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
